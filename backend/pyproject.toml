[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "question-paper-gen"
version = "0.1.0"
description = "Source-grounded, Bloom-aligned college question paper generation"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "boto3>=1.35,<2",
  "fastapi>=0.111,<1",
  "pydantic>=2.11,<3",
  "pydantic-ai>=0.3,<1",
  "PyMuPDF>=1.25,<2",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[project.scripts]
question-paper-gen = "question_paper_gen.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
